name: Candidate source live probe

on:
  push:
    branches: [arena/e7fdddcb-kitsugi-manga-plugins]
    paths:
      - tools/candidate_live_probe.py
      - .github/workflows/candidate-live-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install requests==2.32.5 pillow==11.3.0 beautifulsoup4==4.13.4
      - name: Probe candidate sources end to end
        run: |
          set -o pipefail
          python tools/candidate_live_probe.py --output reports/candidate-live-probe.json 2>&1 | tee /tmp/candidate-probe.log
      - name: Record probe report on the branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p reports
          if [ ! -s reports/candidate-live-probe.json ]; then
            printf '{"ok":false,"candidates":{},"error":"probe-result-missing"}\n' > reports/candidate-live-probe.json
          fi
          git config user.name kitsugi-candidate-probe
          git config user.email kitsugi-candidate-probe@users.noreply.github.com
          git add reports/candidate-live-probe.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record candidate live probe [skip ci]"
          git push origin "HEAD:$BRANCH"
