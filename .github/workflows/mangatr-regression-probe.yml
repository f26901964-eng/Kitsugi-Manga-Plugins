name: Manga-TR reported-series diagnostics

on:
  workflow_dispatch:
  push:
    branches: [arena/5307b37d-kitsugi-manga-plugins]
    paths:
      - tools/mangatr_regression_probe.py
      - .github/workflows/mangatr-regression-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostics dependencies
        run: python -m pip install requests==2.32.5 beautifulsoup4
      - name: Probe reported series, chapter cards and readers
        run: python tools/mangatr_regression_probe.py
      - name: Expose sanitized diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('reports/mangatr-regression-results.json')
          report = json.loads(path.read_text())
          for target in report['targets']:
              message = json.dumps(target, ensure_ascii=False, separators=(',', ':'))
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::notice title={target.get('key', 'unknown')}::{message}")
          PY
          cat reports/mangatr-regression-results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-reported-series-diagnostics
          path: reports/mangatr-regression-results.json
          if-no-files-found: error
