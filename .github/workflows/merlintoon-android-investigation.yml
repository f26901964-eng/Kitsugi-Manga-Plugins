name: MerlinToon Android investigation
on:
  workflow_dispatch:
  push:
    branches: [arena/e4d8654c-kitsugi-manga-plugins]
    paths:
      - .github/workflows/merlintoon-android-investigation.yml
      - tools/merlintoon_android_probe.sh
      - tools/merlintoon_android_fixture.py
      - tools/merlintoon_android_proxy.py
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [duplicate, single, single-empty, legacy-empty]
    steps:
      - uses: actions/checkout@v4
      - name: Download released Kitsugi APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.4.455 --repo f26901964-eng/Kitsugi-Beta --pattern '*-foss.apk' --dir /tmp/kitsugi
          ls -lh /tmp/kitsugi
          set -o pipefail
          if ! gh api 'repos/f26901964-eng/Kitsugi-Manga-Plugins/git/blobs/64baa8a80e72a025ae1ba53edff1809e14bba24f' --jq '.content' 2>/tmp/gh-error.log | base64 -d > /tmp/merlin-v1.6.9.apk; then
            while IFS= read -r line; do echo "::error title=Historical APK::$line"; done </tmp/gh-error.log
            exit 1
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: TEST_MODE=${{ matrix.mode }} bash tools/merlintoon_android_probe.sh
      - name: Assert expected behavior in the disposable emulator
        env:
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in
            duplicate)
              grep -q 'Key "eu.kanade.tachiyomi.extension.tr.merlinscans" was already used' /tmp/merlin-android/crash.txt
              echo '::notice::The unpatched app reproduced the duplicate-key crash.'
              ;;
            single)
              test ! -s /tmp/merlin-android/crash.txt
              grep -q 'Manga page 1' /tmp/merlin-android/window.xml
              for page in 0001 0002 0003; do grep -q "GET /pages/$page.png" /tmp/merlin-android/fixture.log; done
              echo '::notice::The released app and current catalog APK loaded all three synthetic images.'
              ;;
            single-empty)
              test ! -s /tmp/merlin-android/crash.txt
              grep -q 'Bölüm görselleri alınamadı' /tmp/merlin-android/window.xml
              grep -q 'KTS-SRC-9008' /tmp/merlin-android/window.xml
              grep -q 'GET /seri/buyucu-coban/bolum-1/' /tmp/merlin-android/fixture.log
              echo '::notice::The empty synthetic chapter displayed the current source error and KTS-SRC-9008.'
              ;;
            legacy-empty)
              test ! -s /tmp/merlin-android/crash.txt
              grep -q 'Kaynak bu bölüm için sayfa döndürmedi' /tmp/merlin-android/window.xml
              grep -q 'KTS-SRC-9008' /tmp/merlin-android/window.xml
              grep -q 'GET /seri/buyucu-coban/bolum-1/' /tmp/merlin-android/fixture.log
              echo '::notice::The legacy source reproduced the reported empty-page error against the synthetic fixture.'
              ;;
          esac
      - name: Upload fresh-emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlintoon-android-diagnostics-${{ matrix.mode }}
          path: /tmp/merlin-android/
          if-no-files-found: ignore
          retention-days: 1
