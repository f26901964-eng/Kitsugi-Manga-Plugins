name: Build native MangaDenizi installable package

on:
  workflow_dispatch:
  push:
    branches: [arena/35425e65-kitsugi-manga-plugins]
    paths:
      - extensions/mangadenizi/**
      - integration/kitsugi-loader-tests/**
      - integration/kitsugi-mex/**
      - .github/workflows/build-mangadenizi.yml

permissions:
  contents: read

jobs:
  build-mex:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch verified compile-only API from actual Kitsugi release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 extensions/mangadenizi/prepare-contract.py
      - name: Compile all source and Android image code; execute native API regressions
        run: |
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar" python3 extensions/mangadenizi/run-gradle.py bash kotatsu-parsers-tr/gradlew -p extensions/mangadenizi :extension:test :extension:exportClasspath --no-daemon --console=plain
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('extensions/mangadenizi/extension/build/test-results/test').glob('TEST-*.xml'))
          assert reports, 'No executed native extension JUnit report'
          totals = {key: sum(int(ET.parse(path).getroot().get(key, '0')) for path in reports) for key in ['tests', 'failures', 'errors', 'skipped']}
          assert totals['tests'] >= 27 and not any(totals[key] for key in ['failures', 'errors', 'skipped']), totals
          print('::notice title=MangaDenizi JUnit::' + str(totals))
          PY
      - name: Dex only plugin classes and create installable native MEX
        run: python3 extensions/mangadenizi/build-mex.py
      - uses: actions/upload-artifact@v4
        with:
          name: mangadenizi-native-mex
          path: extensions/mangadenizi/build/mangadenizi.mex
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kitsugi-compile-only-host-api
          path: extensions/mangadenizi/host-contract/build/libs/host-contract.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mangadenizi-junit
          path: extensions/mangadenizi/extension/build/test-results/test/
          if-no-files-found: warn

  actual-host-android:
    needs: build-mex
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: mangadenizi-native-mex
          path: .audit/android
      - uses: actions/download-artifact@v4
        with:
          name: kitsugi-compile-only-host-api
          path: .audit/android
      - name: Download unchanged official Kitsugi APK (not rebuilt host test stubs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.4.381 --repo f26901964-eng/Kitsugi-Beta --pattern Kitsugi-Beta-v2.4.381-foss.apk --dir .audit/android
          sha256sum .audit/android/*.apk
          python3 extensions/mangadenizi/run-gradle.py bash extensions/mangadenizi/android-smoke/build.sh
      - name: Test Android 14 with the exact read-only fix in real host bytecode
        if: matrix.api == 34
        run: |
          API_JAR="$PWD/.audit/android/host-contract.jar"
          python3 extensions/mangadenizi/run-gradle.py bash kotatsu-parsers-tr/gradlew -p integration/kitsugi-loader-tests classes -PhostApiJar="$API_JAR" --no-daemon --console=plain
          mkdir -p .audit/android/recovery-dex
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 26 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --classpath "$API_JAR" --output .audit/android/recovery-dex integration/kitsugi-loader-tests/build/classes/java/main/com/kitsugi/animelist/data/manga/MangaDeniziRecoveryPolicy.class
          python3 extensions/mangadenizi/run-gradle.py bash kotatsu-parsers-tr/gradlew -p integration/kitsugi-loader-tests run -PhostApiJar="$API_JAR" --args="$PWD/.audit/android/Kitsugi-Beta-v2.4.381-foss.apk $PWD/.audit/android/host-readonly-test-fixture.apk $PWD/.audit/android/recovery-dex/classes.dex" --no-daemon --console=plain
          echo 'HOST_APK=.audit/android/host-readonly-test-fixture.apk' >> "$GITHUB_ENV"
          echo 'HOST_VARIANT=release-with-readonly-loader-test-fixture' >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native MEX through actual host loader, models and all 53 Android-decoded images
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash extensions/mangadenizi/android-smoke/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mangadenizi-android-${{ matrix.api }}-evidence
          path: |
            .audit/android/report.json
            .audit/android/instrumentation.txt
            .audit/android/logcat.txt
          if-no-files-found: warn
