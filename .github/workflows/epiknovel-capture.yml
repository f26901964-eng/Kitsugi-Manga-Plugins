name: Epik Novel HTML capture

# The sandbox cannot reach drive.usercontent.google.com or epiknovel.com, so the raw
# HTML fixtures the parser tests need are downloaded here and committed to the branch.

on:
  push:
    branches: [arena/d00ca1e9-kitsugi-manga-plugins]
    paths:
      - tools/capture_html_dumps.py
      - .github/workflows/epiknovel-capture.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epiknovel-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Download the epiknovel dumps
        run: python tools/capture_html_dumps.py epiknovel
      - name: Commit the dumps
        run: |
          git config user.name kitsugi-html-dump
          git config user.email kitsugi-html-dump@users.noreply.github.com
          git add docs/html-dumps/epiknovel
          if git diff --cached --quiet; then
            echo 'dump yok'
            exit 0
          fi
          git commit -m "chore(evidence): capture the epiknovel HTML dumps [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 4
          done
          exit 1
