name: Mangitto reader diagnosis
on:
  push:
    branches: [arena/e091ade0-kitsugi-manga-plugins]
    paths:
      - tools/kitsugi-beta-mangitto-chapter-identity.patch
      - tools/kitsugi-mangitto-bridge/**
      - tools/mangitto_diagnose.py
      - .github/workflows/mangitto-diagnose.yml
      - keiyoushi-extensions-tr/src/tr/mangitto/**
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/checkout@v4
        with:
          repository: f26901964-eng/Kitsugi-Beta
          ref: b78cbc4cdc39808cb0ec475026edef6b464b71ed
          path: kitsugi-beta-check
      - name: Verify patch against actual application wrapper
        run: |
          git -C kitsugi-beta-check apply --check "$GITHUB_WORKSPACE/tools/kitsugi-beta-mangitto-chapter-identity.patch"
          git -C kitsugi-beta-check apply "$GITHUB_WORKSPACE/tools/kitsugi-beta-mangitto-chapter-identity.patch"
          cmp tools/kitsugi-mangitto-bridge/src/com/kitsugi/animelist/data/manga/MihonChapterIdentity.kt kitsugi-beta-check/app/src/main/java/com/kitsugi/animelist/data/manga/MihonChapterIdentity.kt
      - name: Live API HTML and first image
        run: python3 tools/mangitto_diagnose.py
      - name: Actual DTO plus URL-only host contract
        working-directory: keiyoushi-extensions-tr
        run: |
          set +e
          ./gradlew :src:tr:mangitto:testDebugUnitTest > /tmp/mangitto-tests.log 2>&1
          status=$?
          mkdir -p ../reports/mangitto
          tail -150 /tmp/mangitto-tests.log > ../reports/mangitto/dto-tests.txt
          echo "EXIT_CODE=$status" >> ../reports/mangitto/dto-tests.txt
          find src/tr/mangitto/build/test-results -name '*.xml' -exec cat {} \; > ../reports/mangitto/junit.xml
      - name: Preserve diagnostic evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/mangitto
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'mangitto: save live and DTO diagnosis [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Fail if contract tests failed
        run: grep -q '^EXIT_CODE=0$' reports/mangitto/dto-tests.txt
