name: Manga Diyarı tests and APK

on:
  push:
    branches: [arena/35de187e-kitsugi-manga-plugins, main]
    paths:
      - keiyoushi-extensions-tr/src/tr/mangadiyari/**
      - keiyoushi-extensions-tr/gradle/build-logic/src/main/kotlin/ExtensionPlugin.kt
      - keiyoushi-extensions-tr/build.gradle.kts
      - tests/**
      - tools/mangadiyari_probe.py
      - tools/prepare_mangadiyari_release.py
      - .github/workflows/mangadiyari-ci.yml
      - .github/workflows/mangadiyari-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mangadiyari-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Probe the live API contract from the runner
        run: |
          python3 -m pip install requests pillow
          set -o pipefail
          python3 tools/mangadiyari_probe.py --output mangadiyari-probe.json --summary 2>&1 | tee /tmp/mangadiyari-probe.log
          # Surface the probe result in the step summary and as check annotations, so the evidence
          # is readable without downloading the artifact.
          python3 - <<'PY'
          import json, os, pathlib
          report = json.loads(pathlib.Path("mangadiyari-probe.json").read_text(encoding="utf-8"))
          checks = report["checks"]
          passed = [name for name, data in checks.items() if data["ok"]]
          warned = [name for name, data in checks.items() if not data["ok"] and not data["hard"]]
          lines = [
              f"probe ok: {report['ok']}",
              f"checks passed: {len(passed)}",
              f"warnings: {len(warned)}",
              f"failures: {len(report['failures'])}",
          ]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Manga Diyarı live probe\n\n" + "\n".join(f"- {l}" for l in lines) + "\n")
          print("::notice title=MangaDiyari live probe::" + " | ".join(lines))

          # A single, dense annotation carries every check: the annotation API stays readable
          # even where log/artifact downloads are blocked, and GitHub only keeps ten annotations.
          def render(name, data):
              flag = "OK" if data["ok"] else ("WARN" if not data["hard"] else "FAIL")
              detail = " ".join(
                  f"{k}={json.dumps(v, ensure_ascii=False)}"
                  for k, v in data.items()
                  if k not in ("ok", "hard")
              )
              return f"{name}: {flag} {detail}".strip()

          report_line = " || ".join(render(name, data) for name, data in checks.items())
          report_line = report_line.replace("%", "%25").replace("\r", " ").replace("\n", " ")
          print(report_line)
          print(f"::notice title=probe report::{report_line[:60000]}")
          genres = report.get("genres", {})
          genre_lines = [
              f"{name}: chosen={data['chosen']} totals={json.dumps(data['totals'], ensure_ascii=False)}"
              for name, data in genres.items()
          ]
          genre_text = " || ".join(genre_lines).replace("%", "%25").replace("\r", " ").replace("\n", " ")
          print(f"::notice title=probe genre table::{genre_text[:60000]}")
          groups = {"core": [], "filters": [], "genres": [], "web": []}
          for name, data in checks.items():
              if name.startswith("genre-"):
                  bucket = "genres"
              elif name.startswith(("filter-", "search-", "latest", "popular")):
                  bucket = "filters"
              elif name.startswith(("web-", "cover", "image", "pages")):
                  bucket = "web"
              else:
                  bucket = "core"
              groups[bucket].append(render(name, data))
          for bucket, items in groups.items():
              if not items:
                  continue
              text = " || ".join(items).replace("%", "%25").replace("\r", " ").replace("\n", " ")
              print(f"::notice title=probe {bucket}::{text[:60000]}")
          PY

      - name: Apply the repository Kotlin formatter
        working-directory: keiyoushi-extensions-tr
        run: |
          set -o pipefail
          ./gradlew :src:tr:mangadiyari:spotlessApply 2>&1 | tee /tmp/mangadiyari-gradle.log

      - name: Save formatter-only changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add keiyoushi-extensions-tr/src/tr/mangadiyari
          git commit -m 'style(mangadiyari): apply the repository Kotlin formatter [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Run contract tests and build the release APK
        working-directory: keiyoushi-extensions-tr
        env:
          # Opt in to the live contract gate; the probe report is written by the step above.
          MANGADIYARI_LIVE_TEST: '1'
          MANGADIYARI_LIVE_REPORT: ${{ github.workspace }}/mangadiyari-probe.json
        run: |
          set -o pipefail
          ./gradlew :src:tr:mangadiyari:testDebugUnitTest :src:tr:mangadiyari:assembleRelease 2>&1 | tee /tmp/mangadiyari-gradle.log

      - name: Expose failures in the check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          for report in pathlib.Path('keiyoushi-extensions-tr/src/tr/mangadiyari/build/test-results').rglob('TEST-*.xml'):
              text = report.read_text(encoding='utf-8', errors='replace')
              for block in text.split('<testcase')[1:]:
                  if '<failure' in block or '<error' in block:
                      name = block.split('name="', 1)[1].split('"', 1)[0]
                      message = block.split('message="', 1)[1].split('"', 1)[0] if 'message="' in block else ''
                      line = f"FAILED {name}: {message}"[:1000]
                      line = line.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')
                      print(f"::error title=MangaDiyari unit test::{line}")
          PY

      - name: Upload the probe report and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangadiyari-probe-and-tests
          path: |
            mangadiyari-probe.json
            keiyoushi-extensions-tr/src/tr/mangadiyari/build/test-results/
          if-no-files-found: warn

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: mangadiyari-release-apk
          path: keiyoushi-extensions-tr/src/tr/mangadiyari/build/outputs/apk/release/*.apk
