name: Mangitto verified APK and activation

on:
  workflow_dispatch:
  push:
    branches: [arena/480f8724-kitsugi-manga-plugins]
    paths:
      - keiyoushi-extensions-tr/src/tr/mangitto/**
      - docs/mangitto/**
      - .github/workflows/mangitto-release.yml

permissions:
  contents: write

concurrency:
  group: mangitto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Select module for compilation (not published yet)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('enabled_plugins.txt')
          text = path.read_text()
          text = '\n'.join(line for line in text.splitlines() if not line.startswith('# tr/mangitto')) + '\n'
          if 'tr/mangitto' not in text.splitlines():
              text += 'tr/mangitto\n'
          path.write_text(text)
          PY
      - name: Test fixtures and build signed APK
        working-directory: keiyoushi-extensions-tr
        run: ./gradlew :src:tr:mangitto:spotlessApply :src:tr:mangitto:testDebugUnitTest :src:tr:mangitto:assembleRelease
      - name: Prepare and verify the new catalogs
        run: |
          python3 tools/prepare_extension_release.py mangitto
          python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: mangitto-apk-and-tests
          path: |
            keiyoushi-extensions-tr/src/tr/mangitto/build/outputs/apk/release/*.apk
            keiyoushi-extensions-tr/src/tr/mangitto/build/reports/tests/
      - name: Save verified artifacts on the same branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enabled_plugins.txt keiyoushi-extensions-tr/src/tr/mangitto prebuilt/apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'mangitto: activate verified 1.6.2 APK [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
