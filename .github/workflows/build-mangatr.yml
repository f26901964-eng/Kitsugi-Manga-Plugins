name: Manga-TR Derle ve Yayınla
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["keiyoushi-extensions-tr/src/tr/mangatr/**", ".github/workflows/build-mangatr.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK kontrol
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lh $ANDROID_HOME/platform-tools 2>&1 | head -n 20
          ls $ANDROID_HOME/cmdline-tools/ 2>&1 | head
          ls $ANDROID_HOME/build-tools/ 2>&1 | head
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version 2>&1 | head
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | tail -n 5 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>&1 | head -n 40
      - name: Derle Manga-TR
        working-directory: keiyoushi-extensions-tr
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :src:tr:mangatr:assembleRelease --stacktrace --info 2>&1 | tee /tmp/gradle.log
          echo "=== gradle finished ==="
          ls -lh src/tr/mangatr/build/outputs/apk/release/ 2>&1 | tee -a /tmp/gradle.log
          cp src/tr/mangatr/build/outputs/apk/release/*.apk ../prebuilt/apk/tachiyomi-tr.mangatr-v1.6.26.apk
          cp ../prebuilt/apk/tachiyomi-tr.mangatr-v1.6.26.apk ../apk/tachiyomi-tr.mangatr-v1.6.26.apk
          cp ../prebuilt/apk/tachiyomi-tr.mangatr-v1.6.26.apk ../builds/apk/tachiyomi-tr.mangatr-v1.6.26.apk
      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
      - name: Katalog güncelle
        run: |
          python3 tools/sync_enabled_plugins.py
          python3 -m unittest discover -s tests -v
      - name: Commit ve Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt/apk/tachiyomi-tr.mangatr-v1.6.26.apk apk/tachiyomi-tr.mangatr-v1.6.26.apk builds/apk/tachiyomi-tr.mangatr-v1.6.26.apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
          git diff --cached --quiet && echo "değişiklik yok" && exit 0
          git commit -m "mangatr: gerçek derlenmiş 1.6.26 APK (Chainsaw Man arama düzeltmesi)"
          git push origin HEAD:main
