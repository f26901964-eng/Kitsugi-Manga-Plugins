name: Manga-TR Derle ve Yayınla
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["keiyoushi-extensions-tr/src/tr/mangatr/**", ".github/workflows/build-mangatr.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Derle Manga-TR
        working-directory: keiyoushi-extensions-tr
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :src:tr:mangatr:assembleRelease -x spotlessCheck --stacktrace --info 2>&1 | tee /tmp/gradle.log || true
          echo "=== gradle finished code $? ===" | tee -a /tmp/gradle.log
          ls -lh src/tr/mangatr/build/outputs/apk/release/ 2>&1 | tee -a /tmp/gradle.log || echo "no apk" | tee -a /tmp/gradle.log
          if ls src/tr/mangatr/build/outputs/apk/release/*.apk 1>/dev/null 2>&1; then
            cp src/tr/mangatr/build/outputs/apk/release/*.apk ../prebuilt/apk/tachiyomi-tr.mangatr-v1.6.26.apk
            cp ../prebuilt/apk/tachiyomi-tr.mangatr-v1.6.26.apk ../apk/tachiyomi-tr.mangatr-v1.6.26.apk
            cp ../prebuilt/apk/tachiyomi-tr.mangatr-v1.6.26.apk ../builds/apk/tachiyomi-tr.mangatr-v1.6.26.apk
          fi
          cat /tmp/gradle.log
      - name: Logu repoya kaydet (hata ayiklama)
        if: always()
        run: |
          mkdir -p /tmp/logbranch
          cp /tmp/gradle.log /tmp/logbranch/gradle-${{ github.run_id }}.log || echo "no log" > /tmp/logbranch/gradle-${{ github.run_id }}.log
          cd /tmp/logbranch
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin logs 2>&1 | head || echo "no logs branch yet"
          git checkout -B logs
          git add gradle-${{ github.run_id }}.log
          git commit -m "gradle log ${{ github.run_id }}" || echo "nothing to commit"
          git push origin logs 2>&1 | tail || echo "push failed"
      - name: Katalog güncelle
        if: always()
        run: |
          if ls ../prebuilt/apk/tachiyomi-tr.mangatr-v1.6.26.apk 1>/dev/null 2>&1; then
            python3 ../tools/sync_enabled_plugins.py || true
            python3 -m unittest discover -s ../tests -v || true
          fi
        working-directory: keiyoushi-extensions-tr
      - name: Commit ve Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt/apk/tachiyomi-tr.mangatr-v1.6.26.apk apk/tachiyomi-tr.mangatr-v1.6.26.apk builds/apk/tachiyomi-tr.mangatr-v1.6.26.apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json || true
          git diff --cached --quiet && echo "değişiklik yok" && exit 0
          git commit -m "mangatr: gerçek derlenmiş 1.6.26 APK (Chainsaw Man arama düzeltmesi)"
          git push origin HEAD:main
