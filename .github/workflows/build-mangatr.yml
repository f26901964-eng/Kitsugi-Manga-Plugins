name: Manga-TR Derle ve Yayınla
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["keiyoushi-extensions-tr/src/tr/mangatr/**", ".github/workflows/build-mangatr.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Derle Manga-TR
        working-directory: keiyoushi-extensions-tr
        run: |
          chmod +x gradlew
          ./gradlew :src:tr:mangatr:assembleRelease -x spotlessCheck --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "GRADLE_EXIT:${PIPESTATUS[0]}" >> /tmp/gradle.log
          echo "=== find apk ===" >> /tmp/gradle.log
          find . -name "*.apk" -type f 2>&1 | tee -a /tmp/gradle.log
          ls -R src/tr/mangatr/build/outputs 2>&1 | head -n 100 | tee -a /tmp/gradle.log || true
          python3 ../tools/prepare_mangatr_release.py | tee -a /tmp/gradle.log
          cat /tmp/gradle.log
      - name: Logu ana dala ekle
        if: always()
        run: |
          if [ -f /tmp/gradle.log ]; then cp /tmp/gradle.log ./gradle-${{ github.run_id }}.log || true; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle-${{ github.run_id }}.log 2>&1 | head || true
          git commit -m "gradle log ${{ github.run_id }}" 2>&1 | head || true
          git push origin HEAD:main 2>&1 | tail || echo "push log failed"
      - name: Katalog güncelle
        run: |
          python3 ../tools/sync_enabled_plugins.py || true
          python3 -m unittest discover -s ../tests -v || true
        working-directory: keiyoushi-extensions-tr
      - name: Commit ve Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt/apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
          git diff --cached --quiet && echo "değişiklik yok" && exit 0
          git commit -m "mangatr: gerçek derlenmiş APK ve katalog güncellemesi"
          git push origin HEAD:main
