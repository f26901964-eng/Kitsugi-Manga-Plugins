name: MangaDenizi runtime contract (live)

on:
  push:
    branches: [arena/e7fdddcb-kitsugi-manga-plugins, main]
    paths:
      - tests/mangadenizi_runtime/**
      - tools/candidate_live_probe.py
      - .github/workflows/mangadenizi-runtime.yml
      - enabled_plugins.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoding dependency
        run: python -m pip install pillow==11.3.0
      - name: Run the ported MangaDenizi logic against the live site
        env:
          REPORT: reports/mangadenizi-runtime.json
        run: node tests/mangadenizi_runtime/run.mjs 2>&1 | tee /tmp/mangadenizi-runtime.log
      - name: Keep the evidence in the repository
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports
          if [ ! -s reports/mangadenizi-runtime.json ]; then
            printf '{"passed":0,"total":0,"checks":[{"name":"report-missing","ok":false}]}\n' > reports/mangadenizi-runtime.json
          fi
          cat reports/mangadenizi-runtime.json
          git config user.name kitsugi-runtime-probe
          git config user.email kitsugi-runtime-probe@users.noreply.github.com
          git add reports/mangadenizi-runtime.json
          git diff --cached --quiet && exit 0
          git commit -m "ci: record the MangaDenizi runtime probe [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
