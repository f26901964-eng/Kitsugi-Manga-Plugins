name: MerlinToon verification

on:
  workflow_dispatch:
  push:
    branches: [arena/27856512-kitsugi-manga-plugins]
    paths:
      - keiyoushi-extensions-tr/src/tr/merlinscans/**
      - keiyoushi-extensions-tr/lib-multisrc/initmanga/**
      - .github/workflows/merlintoon-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select module for build only
        run: grep -qxF 'tr/merlinscans' enabled_plugins.txt || echo tr/merlinscans >> enabled_plugins.txt
      - name: Test and build
        working-directory: keiyoushi-extensions-tr
        shell: bash
        run: |
          set +e
          ./gradlew :src:tr:merlinscans:spotlessApply :src:tr:merlinscans:testDebugUnitTest :src:tr:merlinscans:assembleRelease --stacktrace > /tmp/gradle.log 2>&1
          result=$?
          tail -100 /tmp/gradle.log
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              echo "::error title=Gradle diagnostic::${line}"
            done < <(grep -E '^e: |error:|What went wrong|Execution failed|Caused by:|FAILED|Could not|Exception' /tmp/gradle.log | head -50)
            python3 - <<'PYCODE'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('src/tr/merlinscans/build/test-results/testDebugUnitTest/TEST-*.xml'):
              for case in ET.parse(f).iter('testcase'):
                  for failure in case.findall('failure'):
                      text = ' '.join((failure.get('message', '') + ' ' + (failure.text or '')).split())[:3000]
                      print('::error title=Parser test::' + case.get('name', '') + ': ' + text.replace('%', '%25'))
          PYCODE
            exit "$result"
          fi
      - name: Verify update signing certificate
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from tools.verify_mangadiyari_signature import signing_block_certificate
          old, = Path('prebuilt/apk').glob('tachiyomi-tr.merlinscans-v*.apk')
          new = next(Path('keiyoushi-extensions-tr/src/tr/merlinscans/build/outputs/apk/release').glob('*.apk'))
          if signing_block_certificate(old) != signing_block_certificate(new):
              raise SystemExit('New APK certificate does not match the installed catalog APK')
          print('New APK certificate matches the installed catalog APK')
          PYCODE
      - name: Probe reported chapter (informational)
        run: |
          python3 - <<'PYCODE'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          url = 'https://merlintoon.com/seri/buyucu-coban/bolum-1/'
          try:
              with urlopen(Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Referer': 'https://merlintoon.com/'}), timeout=30) as response:
                  print(f'::notice title=Live chapter::HTTP {response.status}; reachability only, reader and images are not verified')
          except (HTTPError, URLError, OSError) as exc:
              print(f'::warning title=Live chapter::Unable to verify reported chapter: {exc}')
          PYCODE
      - name: Prepare catalog
        run: |
          python3 tools/prepare_extension_release.py merlinscans
          python3 -m unittest discover -s tests -v
          tar -czf /tmp/merlintoon-artifacts.tar.gz enabled_plugins.txt prebuilt/apk/tachiyomi-tr.merlinscans-v*.apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: merlintoon-artifacts
          path: /tmp/merlintoon-artifacts.tar.gz
      - name: Save verified APK and catalog on this branch
        if: github.ref == 'refs/heads/arena/27856512-kitsugi-manga-plugins'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enabled_plugins.txt keiyoushi-extensions-tr/src/tr/merlinscans prebuilt/apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'merlintoon: activate verified APK and catalogs [skip ci]'
          git push origin HEAD:arena/27856512-kitsugi-manga-plugins
