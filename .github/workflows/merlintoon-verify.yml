name: MerlinToon verification

on:
  workflow_dispatch:
  push:
    branches: [arena/513348c3-kitsugi-manga-plugins]
    paths:
      - keiyoushi-extensions-tr/src/tr/merlinscans/**
      - .github/workflows/merlintoon-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select module for build only
        run: echo tr/merlinscans >> enabled_plugins.txt
      - name: Test and build
        working-directory: keiyoushi-extensions-tr
        run: ./gradlew :src:tr:merlinscans:testDebugUnitTest :src:tr:merlinscans:assembleRelease --stacktrace
      - name: Prepare catalog
        run: |
          python3 tools/prepare_extension_release.py merlinscans
          python3 -m unittest discover -s tests -v
          tar -czf /tmp/merlintoon-artifacts.tar.gz enabled_plugins.txt prebuilt/apk/tachiyomi-tr.merlinscans-v1.6.5.apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: merlintoon-artifacts
          path: /tmp/merlintoon-artifacts.tar.gz
