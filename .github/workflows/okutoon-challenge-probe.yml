name: OkuToon challenge research
on:
  push:
    branches: [arena/c26a42e3-kitsugi-manga-plugins]
    paths:
      - tests/okutoon_challenge/**
      - .github/workflows/okutoon-challenge-probe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser driver
        run: |
          mkdir -p /tmp/okutoon-probe
          cd /tmp/okutoon-probe
          npm init -y > /dev/null
          npm install playwright@1.56.1 --no-audit --no-fund
      - name: Probe direct requests and headed desktop Chromium
        env:
          PROBE_NODE_DIR: /tmp/okutoon-probe
        run: xvfb-run -a node tests/okutoon_challenge/probe.cjs
      - name: Save sanitized results on session branch
        if: github.ref == 'refs/heads/arena/c26a42e3-kitsugi-manga-plugins'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/okutoon-challenge-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record OkuToon challenge probe [skip ci]'
          git push origin HEAD:arena/c26a42e3-kitsugi-manga-plugins
