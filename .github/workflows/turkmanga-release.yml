name: Turkmanga parser verification and APK release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/3a75f4c6-kitsugi-manga-plugins
    paths:
      - enabled_plugins.txt
      - registry/extensions.json
      - registry/extensions.v2.json
      - keiyoushi-extensions-tr/src/tr/turkmanga/**
      - docs/turkmanga/**
      - tests/test_catalog.py
      - .github/workflows/turkmanga-release.yml

permissions:
  contents: write

concurrency:
  group: turkmanga-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Parser tests and release APK
        working-directory: keiyoushi-extensions-tr
        shell: bash
        run: |
          set +e
          ./gradlew :src:tr:turkmanga:spotlessApply :src:tr:turkmanga:testDebugUnitTest :src:tr:turkmanga:assembleRelease --stacktrace --console=plain > /tmp/turkmanga-gradle.log 2>&1
          result=$?
          set -e
          tail -n 80 /tmp/turkmanga-gradle.log
          if [ "$result" -ne 0 ]; then
            mapfile -t diagnostics < <(grep -E '(^e: |^FAILURE:|^> Task .*FAILED|^What went wrong:|Unresolved reference|AssertionError|Compilation error)' /tmp/turkmanga-gradle.log | tail -n 20)
            if [ "${#diagnostics[@]}" -eq 0 ]; then mapfile -t diagnostics < <(tail -n 20 /tmp/turkmanga-gradle.log); fi
            for line in "${diagnostics[@]}"; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              echo "::error title=Gradle diagnostic::${line}"
            done
            exit "$result"
          fi
      - name: Register APK and synchronize the catalog
        run: |
          python3 tools/prepare_extension_release.py turkmanga
          python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turkmanga-apk-and-parser-tests
          path: |
            keiyoushi-extensions-tr/src/tr/turkmanga/build/outputs/apk/release/*.apk
            keiyoushi-extensions-tr/src/tr/turkmanga/build/reports/tests/
            keiyoushi-extensions-tr/src/tr/turkmanga/build/test-results/
          if-no-files-found: warn
      - name: Save the verified APK and catalogs on this branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f enabled_plugins.txt keiyoushi-extensions-tr/src/tr/turkmanga prebuilt/apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'turkmanga: publish verified APK and catalogs [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
