name: MerlinToon live probe
on:
  workflow_dispatch:
  push:
    branches: [arena/e4d8654c-kitsugi-manga-plugins]
    paths:
      - tools/merlintoon_browser_probe.py
      - .github/workflows/merlintoon-live.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and TLS client
        run: |
          python -m pip install playwright curl_cffi
          python -m playwright install --with-deps chromium firefox
      - name: Try real browser sessions and capture the public reader response
        run: xvfb-run -a python tools/merlintoon_browser_probe.py
      - name: Upload public response for temporary offline testing, if obtained
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlintoon-live-public-reader
          path: /tmp/merlintoon-live-reader.html
          if-no-files-found: ignore
          retention-days: 1
