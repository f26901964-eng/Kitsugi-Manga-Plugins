name: MerlinToon reader investigation
on:
  push:
    branches: [arena/27856512-kitsugi-manga-plugins]
    paths:
      - '.github/workflows/merlintoon-reader-investigation.yml'
      - 'keiyoushi-extensions-tr/src/tr/merlinscans/src/test/**'
      - 'keiyoushi-extensions-tr/src/tr/merlinscans/src/eu/**'
      - 'keiyoushi-extensions-tr/lib-multisrc/initmanga/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MERLIN_FIXTURE_URL: ${{ secrets.MERLIN_FIXTURE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download the user-supplied chapter to a temporary file
        if: env.MERLIN_FIXTURE_URL != ''
        run: |
          curl -fsSL --max-time 60 "$MERLIN_FIXTURE_URL" -o /tmp/merlin-reader.html
          test "$(wc -c < /tmp/merlin-reader.html)" -gt 100000
      - name: Run the actual source against the real HTML
        working-directory: keiyoushi-extensions-tr
        env:
          MERLIN_REAL_READER_HTML: /tmp/merlin-reader.html
        run: |
          set +e
          ./gradlew :src:tr:merlinscans:testDebugUnitTest --rerun-tasks > /tmp/merlin-test.log 2>&1
          result=$?
          tail -70 /tmp/merlin-test.log
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('src/tr/merlinscans/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(f).getroot()
              for test in root.iter('testcase'):
                  for fail in test.findall('failure'):
                      text = ' '.join((fail.get('message', '') + ' ' + (fail.text or '')).split())[:3000]
                      print('::error title=Reader test::' + test.get('name', '') + ': ' + text.replace('%', '%25'))
              for output in root.iter('system-out'):
                  for line in (output.text or '').splitlines():
                      if line.startswith('REAL_FIXTURE:'):
                          print('::notice title=Real fixture::' + line)
          PY
          exit "$result"
