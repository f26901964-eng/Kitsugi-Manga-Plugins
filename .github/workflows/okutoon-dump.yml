name: OkuToon HTML dump (diagnostic)

on:
  push:
    branches: [arena/777ee838-kitsugi-manga-plugins]
    paths:
      - tests/okutoon_runtime/probe.mjs
      - .github/workflows/okutoon-dump.yml

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe the markup
        run: |
          set -o pipefail
          mkdir -p docs/html-dumps/okutoon
          node tests/okutoon_runtime/probe.mjs 2>&1 | tee docs/html-dumps/okutoon/probe.txt || true
      - name: Commit the evidence
        if: always()
        run: |
          git config user.name kitsugi-tr-runtime
          git config user.email kitsugi-tr-runtime@users.noreply.github.com
          git add -A docs/html-dumps/okutoon
          git status --short
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "değişiklik yok"
            exit 0
          fi
          git commit -m "chore(evidence): okutoon markup probe [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
