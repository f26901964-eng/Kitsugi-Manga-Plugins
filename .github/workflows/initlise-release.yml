name: Initlise-Next kaynak APK yayını

on:
  workflow_dispatch:
  push:
    branches: [arena/f38c7f22-kitsugi-manga-plugins, main]
    paths:
      - keiyoushi-extensions-tr/lib-multisrc/initlisenext/**
      - keiyoushi-extensions-tr/src/tr/duckscans/**
      - keiyoushi-extensions-tr/src/tr/lunariscans/**
      - keiyoushi-extensions-tr/src/tr/ailurascans/**
      - keiyoushi-extensions-tr/src/tr/oblivionscans/**
      - tools/prepare_extension_release.py
      - tools/release_version.py
      - tools/apk_manifest.py
      - .github/workflows/initlise-release.yml

permissions:
  contents: write

concurrency:
  group: initlise-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Biçimi otomatik düzelt (spotlessApply) ve işle
        working-directory: keiyoushi-extensions-tr
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          ./gradlew :lib-multisrc:initlisenext:spotlessApply \
            :src:tr:duckscans:spotlessApply :src:tr:lunariscans:spotlessApply \
            :src:tr:ailurascans:spotlessApply :src:tr:oblivionscans:spotlessApply \
            > /tmp/spotless.log 2>&1 || true
          tail -5 /tmp/spotless.log
          cd ..
          git config user.name 'kitsugi-spotless'
          git config user.email 'kitsugi-spotless@users.noreply.github.com'
          git add keiyoushi-extensions-tr/lib-multisrc/initlisenext \
            keiyoushi-extensions-tr/src/tr/duckscans \
            keiyoushi-extensions-tr/src/tr/lunariscans \
            keiyoushi-extensions-tr/src/tr/ailurascans \
            keiyoushi-extensions-tr/src/tr/oblivionscans
          if ! git diff --cached --quiet; then
            git commit -m "style: spotlessApply (Initlise-Next) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -q origin "$BRANCH" || true
              if git push origin "HEAD:$BRANCH"; then break; fi
              sleep 4
            done
          fi
      - name: Dört Initlise-Next uzantısını derle ve test et
        working-directory: keiyoushi-extensions-tr
        run: |
          ./gradlew \
            :src:tr:duckscans:testDebugUnitTest :src:tr:duckscans:assembleRelease \
            :src:tr:lunariscans:testDebugUnitTest :src:tr:lunariscans:assembleRelease \
            :src:tr:ailurascans:testDebugUnitTest :src:tr:ailurascans:assembleRelease \
            :src:tr:oblivionscans:testDebugUnitTest :src:tr:oblivionscans:assembleRelease \
            --stacktrace > /tmp/gradle.log 2>&1 || echo "GRADLE_FAILED" >> /tmp/gradle.log
          tail -60 /tmp/gradle.log
          if grep -q GRADLE_FAILED /tmp/gradle.log; then exit 1; fi
      - name: Derleme kaydını dala işle (hata analizi için)
        if: failure()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p reports
          tail -c 120000 /tmp/gradle.log > reports/initlise-gradle.log || true
          git config user.name 'kitsugi-buildlog'
          git config user.email 'kitsugi-buildlog@users.noreply.github.com'
          git add reports/initlise-gradle.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: Initlise-Next derleme hata kaydı [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep 4
          done
          exit 0
      - name: APK'ları kataloğa işle ve tutarlılığı doğrula
        run: |
          set -o pipefail
          {
            python3 tools/prepare_extension_release.py duckscans lunariscans ailurascans oblivionscans
            python3 -m unittest discover -s tests
          } 2>&1 | tee /tmp/publish.log
      - name: Yayın dosyalarını dala işle
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -o pipefail
          {
            set -euo pipefail
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f prebuilt/apk apk builds/apk index.json plugins.json \
              builds/index.json builds/plugins.json builds/index.v2.json \
              registry/extensions.json registry/extensions.v2.json
            echo '--- staged ---'
            git status --porcelain
            if git diff --cached --quiet; then
              echo 'Yayın zaten güncel.'
              exit 0
            fi
            git commit -m "ci: Initlise-Next APK yayını (duck/lunari/ailura/oblivion) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -q origin "$BRANCH" || true
              if git push origin "HEAD:$BRANCH"; then exit 0; fi
              sleep 4
            done
            exit 1
          } 2>&1 | tee /tmp/commit.log
