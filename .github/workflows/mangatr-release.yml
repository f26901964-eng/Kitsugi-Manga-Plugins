name: Manga-TR branch APK release

on:
  workflow_dispatch:
  push:
    branches: [arena/b636bb7e-kitsugi-manga-plugins]
    paths:
      - keiyoushi-extensions-tr/src/tr/mangatr/build.gradle.kts
      - tools/prepare_mangatr_release.py
      - .github/workflows/mangatr-release.yml

permissions:
  contents: write

concurrency:
  group: mangatr-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Test and build the release APK
        working-directory: keiyoushi-extensions-tr
        run: ./gradlew :src:tr:mangatr:testDebugUnitTest :src:tr:mangatr:assembleRelease
      - name: Publish the APK and synchronize catalogs
        run: |
          python3 tools/prepare_mangatr_release.py
          python3 -m unittest discover -s tests -v
      - name: Commit the published artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt/apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
          git diff --cached --quiet && exit 0
          git commit -m 'mangatr: publish compiled APK and catalogs [skip ci]'
          git pull --rebase origin arena/b636bb7e-kitsugi-manga-plugins
          git push origin HEAD:arena/b636bb7e-kitsugi-manga-plugins
      - name: Upload the tested release APK
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-published-apk
          path: keiyoushi-extensions-tr/src/tr/mangatr/build/outputs/apk/release/*.apk
