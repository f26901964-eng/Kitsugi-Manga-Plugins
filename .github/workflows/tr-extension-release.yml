name: TR extension APK release

on:
  workflow_dispatch:
    inputs:
      modules:
        description: 'Comma separated modules under src/tr (e.g. hayalistic,korelimanga)'
        required: true
        default: 'hayalistic'
  push:
    branches: [arena/58af4423-kitsugi-manga-plugins]
    paths:
      - keiyoushi-extensions-tr/src/tr/hayalistic/build.gradle.kts
      - tools/prepare_extension_release.py
      - tools/release_version.py
      - tools/apk_manifest.py
      - .github/workflows/tr-extension-release.yml

permissions:
  contents: write

concurrency:
  group: tr-extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build the release APKs for the changed extensions
        working-directory: keiyoushi-extensions-tr
        run: |
          set -o pipefail
          ./gradlew :src:tr:hayalistic:assembleRelease :src:tr:korelimanga:assembleRelease 2>&1 | tail -40
      - name: Publish the APKs and synchronize the catalogs
        run: |
          set -o pipefail
          # The catalog entry is taken from each built APK's manifest, and a version code
          # that would go backwards is refused instead of being published.
          python3 tools/prepare_extension_release.py hayalistic korelimanga
          python3 -m unittest discover -s tests
      - name: Commit the published artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt/apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
          if git diff --cached --quiet; then
            echo 'Yayın zaten güncel.'
            exit 0
          fi
          git commit -m 'hayalistic, korelimanga: publish the fixed APKs and catalogs [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
