name: TR extension APK release

on:
  workflow_dispatch:
    inputs:
      modules:
        description: 'Comma separated modules under src/tr (e.g. okutoon)'
        required: true
        default: 'okutoon'
  push:
    branches: [main, arena/777ee838-kitsugi-manga-plugins]
    paths:
      - keiyoushi-extensions-tr/src/tr/okutoon/build.gradle.kts
      - keiyoushi-extensions-tr/src/tr/okutoon/src/**
      - tests/okutoon_runtime/**
      - tools/prepare_extension_release.py
      - tools/release_version.py
      - tools/apk_manifest.py
      - .github/workflows/tr-extension-release.yml

permissions:
  contents: write

concurrency:
  group: tr-extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build the release APK
        working-directory: keiyoushi-extensions-tr
        run: |
          ./gradlew :src:tr:okutoon:assembleRelease --stacktrace > /tmp/gradle.log 2>&1 || echo "GRADLE_FAILED" >> /tmp/gradle.log
          tail -60 /tmp/gradle.log
          if grep -q GRADLE_FAILED /tmp/gradle.log; then exit 1; fi
      - name: Live end-to-end probe of okutoon.com
        continue-on-error: true
        run: |
          set -o pipefail
          REPORT=reports/okutoon-runtime.json node tests/okutoon_runtime/run.mjs 2>&1 | tee /tmp/okutoon-probe.log || true
      - name: Publish the APK and synchronize the catalogs
        run: |
          # The catalog numbers come from the built APK's manifest; a version code that
          # would go backwards is refused instead of being published.
          set -o pipefail
          {
            python3 tools/prepare_extension_release.py okutoon
            python3 -m unittest discover -s tests
          } 2>&1 | tee /tmp/publish.log
      - name: Record the build log no matter what
        if: always()
        run: |
          mkdir -p docs/build-logs
          { echo "commit: ${GITHUB_SHA}"; echo '--- live probe ---'; cat /tmp/okutoon-probe.log 2>/dev/null || true; echo '--- publish ---'; cat /tmp/publish.log 2>/dev/null || true; echo '--- build tail ---'; grep -iE "^e: |error:|Unresolved|Cannot|FAILURE|What went wrong" /tmp/gradle.log || true; tail -20 /tmp/gradle.log; } > docs/build-logs/okutoon-build.log || true
          git config user.name kitsugi-tr-runtime
          git config user.email kitsugi-tr-runtime@users.noreply.github.com
          git add -f docs/build-logs/okutoon-build.log
          git commit -m "ci: record the okutoon build log [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 4
          done
      - name: Commit the published artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt/apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
          if git diff --cached --quiet; then
            echo 'Yayın zaten güncel.'
            exit 0
          fi
          git commit -m 'okutoon: publish the fixed APK and catalogs [skip ci]'
          # The build-log step pushes to the same branch, so retry instead of giving up on
          # the first non-fast-forward rejection.
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            if ! git rebase -q "origin/${GITHUB_REF_NAME}"; then
              echo 'rebase çakıştı, uzak sürüm korunuyor'
              git rebase --abort || true
              git reset -q --hard "origin/${GITHUB_REF_NAME}"
              exit 0
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 5
          done
          echo 'yayın commit yapılamadı: push reddedildi' >&2
          exit 1
