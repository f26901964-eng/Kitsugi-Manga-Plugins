name: Manga-TR live end-to-end smoke test

on:
  workflow_dispatch:
  push:
    branches: [arena/b636bb7e-kitsugi-manga-plugins]
    paths:
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTR.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTRContract.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTRReaderContract.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTRParser.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/Dto.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/DDoSGuardInterceptor.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/test/kotlin/**/MangaTRLiveTest.kt
      - tools/mangatr_orientation_check.py
      - .github/workflows/mangatr-live-smoke.yml

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MANGATR_LIVE_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Apply the repository Kotlin formatter
        working-directory: keiyoushi-extensions-tr
        run: ./gradlew :src:tr:mangatr:spotlessApply
      - name: Verify chapter-one and chapter-two readers and real page images
        working-directory: keiyoushi-extensions-tr
        run: |
          set -o pipefail
          ./gradlew :src:tr:mangatr:testDebugUnitTest --tests '*MangaTRLiveTest' 2>&1 | tee /tmp/mangatr-live-gradle.log
      - name: Install image-orientation verification tools
        if: success()
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur
          python3 -m pip install pillow
      - name: Compare real corrected pages with 180-degree copies
        if: success()
        run: |
          set -o pipefail
          if find keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-live -name 'page-*.png' -print -quit 2>/dev/null | grep -q .; then
            python3 tools/mangatr_orientation_check.py 2>&1 | tee /tmp/mangatr-orientation.log
          else
            echo 'No decoded images were produced; the live test records the runner-only network skip.'
          fi
      - name: Expose live result in the check summary
        if: always()
        run: |
          tail -n 250 /tmp/mangatr-live-gradle.log >> "$GITHUB_STEP_SUMMARY" || true
          cat /tmp/mangatr-orientation.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          failures = []
          for report in Path('keiyoushi-extensions-tr/src/tr/mangatr/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      failures.append(case.get('name', 'test') + '\n' + failure.get('message', '') + '\n' + (failure.text or '')[:12000])
          lines = Path('/tmp/mangatr-live-gradle.log').read_text(errors='replace').splitlines()
          hits = [i for i, line in enumerate(lines) if line.startswith('e: ') or 'FAILURE: Build failed' in line or 'Execution failed for task' in line or 'What went wrong:' in line or 'MangaTRLiveTest >' in line]
          selected = set()
          for i in hits:
              selected.update(range(max(0, i - 2), min(len(lines), i + 6)))
          text = '\n\n'.join(failures) if failures else ('\n'.join(lines[i] for i in sorted(selected))[-48000:] if hits else '\n'.join(lines)[-24000:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Live test failure log::' + text)
          PY
          fi
      - name: Surface runner-only image verification skips
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path('keiyoushi-extensions-tr/src/tr/mangatr/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for skipped in case.findall('skipped'):
                      message = skipped.get('message') or (skipped.text or '')
                      if 'Cloudflare' in message:
                          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::warning title=Live image verification skipped::' + message)
          PY
      - name: Upload corrected pages and orientation comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-orientation-evidence
          path: |
            keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-live/
            keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-orientation/
          if-no-files-found: warn
      - name: Upload live smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-live-smoke-results
          path: keiyoushi-extensions-tr/src/tr/mangatr/build/test-results/
          if-no-files-found: warn
