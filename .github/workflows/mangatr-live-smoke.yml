name: Manga-TR live reader and orientation test

on:
  workflow_dispatch:
  push:
    branches: [arena/720282f3-kitsugi-manga-plugins]
    paths:
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTR.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTRContract.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTRReaderContract.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTRImagePipeline.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTRParser.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/Dto.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/test/kotlin/**/MangaTRLiveTest.kt
      - tools/mangatr_browser_orientation.py
      - tools/mangatr_orientation_check.py
      - .github/workflows/mangatr-live-smoke.yml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install browser and image-orientation verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur
          python3 -m pip install requests playwright beautifulsoup4 pillow
      - name: Compare generated strip codes with the live Chromium reader DOM
        run: |
          rm -f mangatr/live/browser/kotlin-live-failure.txt
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/mangatr_browser_orientation.py 2>&1 | tee /tmp/mangatr-browser.log
      - name: Verify live gates and configs with the production Kotlin contract
        working-directory: keiyoushi-extensions-tr
        env:
          MANGATR_LIVE_TEST: '1'
          MANGATR_LIVE_FIXTURE_DIR: '/tmp/mangatr-kotlin-live-fixture'
        run: |
          rm -f ../mangatr/live/browser/kotlin-live-failure.txt
          set -o pipefail
          ./gradlew :src:tr:mangatr:spotlessApply :src:tr:mangatr:testDebugUnitTest --tests 'eu.kanade.tachiyomi.extension.tr.mangatr.MangaTRLiveTest' 2>&1 | tee /tmp/mangatr-kotlin-live.log
      - name: Publish the real Kotlin failure without browser/CDN log noise
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          log_path = Path('/tmp/mangatr-kotlin-live.log')
          if not log_path.exists():
              raise SystemExit(0)
          failures = []
          for report in Path('keiyoushi-extensions-tr/src/tr/mangatr/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      failures.append(case.get('name', 'test') + '\n' + failure.get('message', '') + '\n' + (failure.text or '')[:12000])
          text = '\n\n'.join(failures) if failures else log_path.read_text(errors='replace')[-16000:]
          text = re.sub(r'[A-Za-z0-9_\-+/=]{32,}', '<redacted>', text)
          output = Path('mangatr/live/browser/kotlin-live-failure.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(text + '\n')
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Production Kotlin live failure::' + escaped)
          PY
      - name: Run OCR here only if this runner received real images
        run: |
          set -o pipefail
          if python3 -c "import json; assert json.load(open('mangatr/live/browser/reader-contract-report.json')).get('real_images_verified')" 2>/dev/null; then
            python3 tools/mangatr_orientation_check.py --expected 5 --minimum-text-samples 2 2>&1 | tee /tmp/mangatr-orientation.log
          else
            echo 'Synthetic pixel checks passed, but they are not real-image or device visual evidence.'
          fi
      - name: Expose sanitized reader contract diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report_path = Path('mangatr/live/browser/reader-contract-report.json')
          if report_path.exists():
              report = json.loads(report_path.read_text())
              keys = (
                  'extension_gate_decrypts', 'chapter_two_gate_decrypts',
                  'extension_expected_page_count', 'chapter_two_expected_page_count',
                  'dom_verification_passed', 'full_page_contract_passed',
                  'real_images_verified', 'contract_passed',
              )
              print(json.dumps({key: report.get(key) for key in keys}, ensure_ascii=False))
          failure = Path('mangatr/live/browser/kotlin-live-failure.txt')
          if failure.exists():
              print(failure.read_text(errors='replace')[-4000:])
          PY
      - name: Require the extension gate and live DOM contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('mangatr/live/browser/reader-contract-report.json').read_text())
          if not (report.get('extension_gate_decrypts') and report.get('dom_verification_passed') and report.get('full_page_contract_passed')):
              print('::error title=Live reader contract::The gate, live DOM, 52/26 full-page count, or original-dimension contract failed; see sanitized reader diagnostics.')
              print(json.dumps({key: value for key, value in report.items() if key != 'samples'}, ensure_ascii=False))
              raise SystemExit(1)
          if not report.get('real_images_verified'):
              print('::warning title=CDN pixel verification unavailable::Runner/CDN restrictions prevented real-image OCR. Synthetic checks validate only the transform algorithm; no real-image or device verification is claimed.')
          PY
      - name: Expose live result in the check summary
        if: always()
        run: |
          cat /tmp/mangatr-kotlin-live.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          tail -n 250 /tmp/mangatr-browser.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat /tmp/mangatr-orientation.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          error_path = Path('keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-orientation/browser-contract-error.txt')
          kotlin_failure = Path('mangatr/live/browser/kotlin-live-failure.txt')
          if kotlin_failure.exists():
              text = kotlin_failure.read_text(errors='replace')
          elif error_path.exists():
              text = error_path.read_text(errors='replace')
          else:
              paths = [Path('/tmp/mangatr-browser.log'), Path('/tmp/mangatr-orientation.log'), Path('/tmp/mangatr-kotlin-live.log')]
              text = '\n'.join(path.read_text(errors='replace') for path in paths if path.exists())[-12000:]
          text = re.sub(r'[A-Za-z0-9_\-+/=]{32,}', '<redacted>', text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Live reader/orientation failure::' + text)
          PY
          fi
      - name: Upload live DOM, corrected pages and orientation comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-orientation-evidence
          path: |
            keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-live/
            keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-browser-site/
            keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-orientation/
            keiyoushi-extensions-tr/src/tr/mangatr/build/test-results/
            mangatr/live/browser/reader-contract-report.json
            mangatr/live/browser/reader-gate-request.json
            mangatr/live/browser/reader-pointer-input.json
            mangatr/live/browser/reader-pointer-snippets.txt
            mangatr/live/browser/pointer-delta.js
            mangatr/live/browser/kotlin-live-failure.txt
          if-no-files-found: warn
