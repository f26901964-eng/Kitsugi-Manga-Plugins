name: Manga-TR live end-to-end smoke test

on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MANGATR_LIVE_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Verify signed chapters, four readers, and first images
        working-directory: keiyoushi-extensions-tr
        run: |
          set -o pipefail
          ./gradlew :src:tr:mangatr:testDebugUnitTest --tests '*MangaTRLiveTest' --stacktrace 2>&1 | tee /tmp/mangatr-live-gradle.log
      - name: Expose live result in the check summary
        if: always()
        run: |
          tail -n 250 /tmp/mangatr-live-gradle.log >> "$GITHUB_STEP_SUMMARY" || true
          if [ "${{ job.status }}" = "failure" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/mangatr-live-gradle.log').read_text(errors='replace')[-24000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Live test failure log::' + text)
          PY
          fi
      - name: Upload live smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-live-smoke-results
          path: keiyoushi-extensions-tr/src/tr/mangatr/build/test-results/
          if-no-files-found: warn
