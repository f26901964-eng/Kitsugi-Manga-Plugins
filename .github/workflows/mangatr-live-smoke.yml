name: Manga-TR live reader and orientation test

on:
  workflow_dispatch:
  push:
    branches: [arena/b636bb7e-kitsugi-manga-plugins]
    paths:
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTR.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTRContract.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTRReaderContract.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/MangaTRParser.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/eu/**/Dto.kt
      - keiyoushi-extensions-tr/src/tr/mangatr/src/test/kotlin/**/MangaTRLiveTest.kt
      - tools/mangatr_browser_orientation.py
      - tools/mangatr_orientation_check.py
      - .github/workflows/mangatr-live-smoke.yml

permissions:
  contents: write

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and image-orientation verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur
          python3 -m pip install requests playwright beautifulsoup4 pillow
      - name: Compare generated strip codes with the live Chromium reader DOM
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/mangatr_browser_orientation.py 2>&1 | tee /tmp/mangatr-browser.log
      - name: Run OCR here only if this runner received real images
        run: |
          set -o pipefail
          if python3 -c "import json; assert json.load(open('mangatr/live/browser/reader-contract-report.json')).get('real_images_verified')" 2>/dev/null; then
            python3 tools/mangatr_orientation_check.py --expected 5 --minimum-text-samples 2 2>&1 | tee /tmp/mangatr-orientation.log
          else
            echo 'Real CDN images are assigned to the macOS runner; Ubuntu synthetic images are not used as visual evidence.'
          fi
      - name: Save sanitized public reader contract diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mangatr/live/browser/reader-contract-report.json mangatr/live/browser/reader-gate-request.json mangatr/live/browser/reader-pointer-input.json mangatr/live/browser/reader-pointer-snippets.txt mangatr/live/browser/pointer-delta.js
          git diff --cached --quiet && exit 0
          git commit -m 'test(mangatr): capture sanitized live reader contract [skip ci]'
          git pull --rebase origin arena/b636bb7e-kitsugi-manga-plugins
          git push origin HEAD:arena/b636bb7e-kitsugi-manga-plugins
      - name: Require both the extension gate and live DOM contract to pass
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('mangatr/live/browser/reader-contract-report.json').read_text())
          if not (report.get('extension_gate_decrypts') and report.get('dom_verification_passed')):
              print('::error title=Live reader contract::The extension gate or live DOM contract failed; see sanitized reader diagnostics.')
              print(json.dumps({key: value for key, value in report.items() if key != 'samples'}, ensure_ascii=False))
              raise SystemExit(1)
          PY
      - name: Expose live result in the check summary
        if: always()
        run: |
          cat /tmp/mangatr-browser.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat /tmp/mangatr-orientation.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          error_path = Path('keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-orientation/browser-contract-error.txt')
          if error_path.exists():
              text = error_path.read_text(errors='replace')
          else:
              paths = [Path('/tmp/mangatr-browser.log'), Path('/tmp/mangatr-orientation.log')]
              text = '\n'.join(path.read_text(errors='replace') for path in paths if path.exists())[-12000:]
          text = re.sub(r'[A-Za-z0-9_\-+/=]{32,}', '<redacted>', text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Live reader/orientation failure::' + text)
          PY
          fi
      - name: Upload live DOM, corrected pages and orientation comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-orientation-evidence
          path: |
            keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-live/
            keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-browser-site/
            keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-orientation/
          if-no-files-found: warn

  real-images-macos:
    runs-on: macos-13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install live reader dependencies
        run: python3 -m pip install requests playwright beautifulsoup4 pillow
      - name: Install Chromium
        run: python3 -m playwright install chromium
      - name: Fetch real chapter pages through the live reader
        shell: bash
        run: |
          set -o pipefail
          python3 tools/mangatr_browser_orientation.py 2>&1 | tee /tmp/mangatr-browser-macos.log
      - name: Require real rather than synthetic CDN images
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('mangatr/live/browser/reader-contract-report.json').read_text())
          print(json.dumps({key: value for key, value in report.items() if key != 'samples'}, ensure_ascii=False))
          if not report.get('passed'):
              print('::error title=Real Manga-TR images::macOS runner did not receive all five real chapter images.')
              raise SystemExit(1)
          PY
      - name: Expose macOS browser result
        if: always()
        shell: bash
        run: cat /tmp/mangatr-browser-macos.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload real macOS reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-real-images-macos
          path: |
            keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-live/
            keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-browser-site/
            keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-orientation/
          if-no-files-found: warn

  real-image-orientation:
    needs: real-images-macos
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mangatr-real-images-macos
          path: keiyoushi-extensions-tr/src/tr/mangatr/build
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur
          python3 -m pip install pillow
      - name: Compare real corrected pages with 180-degree copies
        run: |
          set -o pipefail
          python3 tools/mangatr_orientation_check.py --expected 5 --minimum-text-samples 2 2>&1 | tee /tmp/mangatr-real-orientation.log
      - name: Expose real-image OCR result
        if: always()
        run: cat /tmp/mangatr-real-orientation.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload real-image OCR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-real-orientation-evidence
          path: keiyoushi-extensions-tr/src/tr/mangatr/build/mangatr-orientation/
          if-no-files-found: warn
