name: Manga-TR live end-to-end smoke test

on:
  workflow_dispatch:
  push:
    branches: [arena/d305cc76-kitsugi-manga-plugins]
    paths:
      - keiyoushi-extensions-tr/src/tr/mangatr/src/test/kotlin/**/MangaTRLiveTest.kt
      - .github/workflows/mangatr-live-smoke.yml

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MANGATR_LIVE_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Verify signed chapters, four readers, and first images
        working-directory: keiyoushi-extensions-tr
        run: |
          set -o pipefail
          ./gradlew :src:tr:mangatr:testReleaseUnitTest --tests '*MangaTRLiveTest' --stacktrace 2>&1 | tee /tmp/mangatr-live-gradle.log
      - name: Expose live result in the check summary
        if: always()
        run: tail -n 250 /tmp/mangatr-live-gradle.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload live smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-live-smoke-results
          path: keiyoushi-extensions-tr/src/tr/mangatr/build/test-results/
          if-no-files-found: warn
