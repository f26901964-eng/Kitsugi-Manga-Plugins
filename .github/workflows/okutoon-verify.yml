name: OkuToon APK verification

on:
  workflow_dispatch:
  push:
    branches: [arena/c26a42e3-kitsugi-manga-plugins]
    paths:
      - keiyoushi-extensions-tr/src/tr/okutoon/**
      - tests/test_okutoon*.py
      - tests/okutoon_runtime/**
      - .github/workflows/okutoon-verify.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test parser and build APK
        working-directory: keiyoushi-extensions-tr
        run: ./gradlew :src:tr:okutoon:testDebugUnitTest :src:tr:okutoon:assembleRelease --stacktrace
      - name: Check built APK and catalogs
        run: |
          python3 tools/prepare_extension_release.py okutoon
          python3 -m unittest discover -s tests
      - name: Save verified APK and catalogs to the session branch
        if: github.ref == 'refs/heads/arena/c26a42e3-kitsugi-manga-plugins'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f prebuilt/apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'okutoon: stage verified 1.6.10 APK and catalogs [skip ci]'
          git push origin HEAD:arena/c26a42e3-kitsugi-manga-plugins
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okutoon-tests-and-apk
          path: |
            keiyoushi-extensions-tr/src/tr/okutoon/build/outputs/apk/release/*.apk
            keiyoushi-extensions-tr/src/tr/okutoon/build/test-results/
          if-no-files-found: warn
