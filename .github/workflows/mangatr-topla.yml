name: mangatr-canlı-topla
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sistem hazırla
        run: pip install requests beautifulsoup4 lxml -q

      - name: Eksiksiz topla — eklentinin ihtiyaç duyduğu HER ŞEY
        run: |
          set -e
          python3 tools/mangatr-exhaustive.py
          ls -R mangatr
          echo "---- summary ----"
          cat mangatr/live/summary.json || true
          echo "---- list_keys ----"
          cat mangatr/live/list_keys.json || true
          echo "---- discovered ----"
          cat mangatr/live/discovered_manga.json || true

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-live-dump
          path: |
            mangatr/live/**
            mangatr/raw/**
          if-no-files-found: warn

      - name: Özeti job summary'e yaz
        if: always()
        run: |
          echo "### mangatr/live özet" >> $GITHUB_STEP_SUMMARY
          cat mangatr/live/summary.json >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tüm ham dosyalar artifact'te: mangatr-live-dump" >> $GITHUB_STEP_SUMMARY
