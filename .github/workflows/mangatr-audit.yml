name: Manga-TR live diagnostics and build
on:
  push:
    branches: [arena/d5f3c621-kitsugi-manga-plugins]
    paths: ['tools/mangatr_live_audit.py', '.github/workflows/mangatr-audit.yml', 'keiyoushi-extensions-tr/src/tr/mangatr/**']
permissions:
  contents: read
  checks: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install requests beautifulsoup4 playwright
      - name: Audit
        run: set -o pipefail; (python3 tools/mangatr_live_audit.py && python3 tools/mangatr_browser_audit.py) 2>&1 | tee /tmp/mangatr-audit.txt
      - name: Publish sanitized check summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/publish_audit_check.py 'Manga-TR audit results' /tmp/mangatr-audit.txt
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Manga-TR (not published)
        working-directory: keiyoushi-extensions-tr
        run: set -o pipefail; bash gradlew :src:tr:mangatr:assembleDebug --no-daemon 2>&1 | tee /tmp/mangatr-build.txt
      - name: Publish build check summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/publish_audit_check.py 'Manga-TR build results' /tmp/mangatr-build.txt
