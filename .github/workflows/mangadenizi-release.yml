name: MangaDenizi APK release

on:
  workflow_dispatch:
  push:
    branches:
      - arena/8a6a7a9d-kitsugi-manga-plugins
    paths:
      - enabled_plugins.txt
      - registry/extensions.json
      - registry/extensions.v2.json
      - keiyoushi-extensions-tr/src/tr/mangadenizi/build.gradle.kts
      - keiyoushi-extensions-tr/src/tr/mangadenizi/src/**
      - keiyoushi-extensions-tr/src/tr/mangadenizi/res/**
      - tools/prepare_extension_release.py
      - tools/release_version.py
      - tools/apk_manifest.py
      - .github/workflows/mangadenizi-release.yml

permissions:
  contents: write

concurrency:
  group: mangadenizi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the release APK
        working-directory: keiyoushi-extensions-tr
        shell: bash
        run: |
          set +e
          ./gradlew :src:tr:mangadenizi:assembleRelease --stacktrace --console=plain > /tmp/mangadenizi-gradle.log 2>&1
          result=$?
          set -e
          tail -n 80 /tmp/mangadenizi-gradle.log
          if [ "$result" -ne 0 ]; then
            grep -E '(^e: |error:|What went wrong|FAILED)' /tmp/mangadenizi-gradle.log | tail -n 40 | while IFS= read -r line; do
              echo "::error title=MangaDenizi build::${line//%/%25}"
            done
            exit "$result"
          fi
      - name: Register APK and synchronize the catalog
        run: |
          python3 tools/prepare_extension_release.py mangadenizi
          python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mangadenizi-apk
          path: keiyoushi-extensions-tr/src/tr/mangadenizi/build/outputs/apk/release/*.apk
          if-no-files-found: warn
      - name: Save the verified APK and catalogs on this branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f enabled_plugins.txt keiyoushi-extensions-tr/src/tr/mangadenizi prebuilt/apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'mangadenizi: publish verified APK and catalogs [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
