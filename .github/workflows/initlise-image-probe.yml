name: Initlise-Next görsel sondajı

on:
  workflow_dispatch:
  push:
    branches: [arena/eeee6995-kitsugi-manga-plugins, main]
    paths:
      - tools/initlise_image_probe.py
      - .github/workflows/initlise-image-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Görsel URL'lerini anonim test et
        run: |
          set -o pipefail
          python tools/initlise_image_probe.py 2>&1 | tee /tmp/image-probe.log
      - name: Raporu dala işle
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name kitsugi-image-probe
          git config user.email kitsugi-image-probe@users.noreply.github.com
          git add reports/initlise-image-probe.json docs/html-dumps
          if git diff --cached --quiet; then
            echo 'rapor değişmedi'; exit 0
          fi
          git commit -m "ci: Initlise-Next görsel sondaj raporu [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep 4
          done
          exit 1
