name: SadScans APK build (live verification separate)

on:
  workflow_dispatch:
  push:
    branches: [arena/9e5cc01a-kitsugi-manga-plugins, arena/e222c71c-kitsugi-manga-plugins, main]
    paths:
      - keiyoushi-extensions-tr/src/tr/sadscans/**
      - enabled_plugins.txt
      - registry/extensions.json
      - registry/extensions.v2.json
      - prebuilt/apk/eu.kanade.tachiyomi.extension.tr.sadscans.png
      - tools/prepare_extension_release.py
      - tools/release_version.py
      - tools/apk_manifest.py
      - tools/sync_enabled_plugins.py
      - tests/**
      - .github/workflows/sadscans-release.yml

permissions:
  contents: write

concurrency:
  group: sadscans-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        working-directory: keiyoushi-extensions-tr
        run: |
          set +e
          ./gradlew :src:tr:sadscans:spotlessApply :src:tr:sadscans:assembleRelease 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          grep -E "(^e: |error:|Caused by:|FAILURE:)" /tmp/build.log | head -40 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | tr '\n' ' ' | cut -c1-900)"
          done
          exit "$status"
      - name: Publish compiler output on failure
        if: failure()
        run: |
          mkdir -p docs/build-logs
          tail -c 60000 /tmp/build.log > docs/build-logs/sadscans-build.log 2>/dev/null || echo "build log yok" > docs/build-logs/sadscans-build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/build-logs/sadscans-build.log
          git commit -m 'sadscans: derleme günlüğü [skip ci]' || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
      - name: Prepare and verify the new catalogs
        run: |
          python3 tools/prepare_extension_release.py sadscans
          python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: sadscans-apk
          path: keiyoushi-extensions-tr/src/tr/sadscans/build/outputs/apk/release/*.apk
      - name: Save verified artifacts on the same branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enabled_plugins.txt keiyoushi-extensions-tr/src/tr/sadscans prebuilt/apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'sadscans: save compiled APK candidate [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
