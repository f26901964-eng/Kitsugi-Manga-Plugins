name: Manga Diyarı release (APK + catalogs)

on:
  workflow_dispatch:
  push:
    branches: [arena/35de187e-kitsugi-manga-plugins, main]
    paths:
      - keiyoushi-extensions-tr/src/tr/mangadiyari/build.gradle.kts
      - tools/prepare_mangadiyari_release.py
      - tools/signing/**
      - .github/workflows/mangadiyari-release.yml

permissions:
  contents: write

concurrency:
  group: mangadiyari-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Skip when Manga Diyarı is disabled
        id: enabled
        run: |
          if grep -qx 'tr/mangadiyari' enabled_plugins.txt; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Manga Diyarı devre dışı (enabled_plugins.txt); yayın işi atlandı."
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Probe the live API contract before publishing
        if: steps.enabled.outputs.enabled == 'true'
        run: |
          python3 -m pip install requests pillow
          python3 tools/mangadiyari_probe.py --output mangadiyari-probe.json --summary

      - name: Test and build the release APK
        if: steps.enabled.outputs.enabled == 'true'
        working-directory: keiyoushi-extensions-tr
        env:
          MANGADIYARI_LIVE_TEST: '1'
          MANGADIYARI_LIVE_REPORT: ${{ github.workspace }}/mangadiyari-probe.json
        run: ./gradlew :src:tr:mangadiyari:testDebugUnitTest :src:tr:mangadiyari:assembleRelease

      - name: Fail if the APK is not signed with the repository keystore
        if: steps.enabled.outputs.enabled == 'true'
        run: |
          set -o pipefail
          apk=$(ls keiyoushi-extensions-tr/src/tr/mangadiyari/build/outputs/apk/release/*.apk)
          python3 tools/verify_mangadiyari_signature.py "$apk" tools/signing/mangadiyari.p12

      - name: Publish the APK and synchronize the catalogs
        if: steps.enabled.outputs.enabled == 'true'
        run: |
          python3 tools/prepare_mangadiyari_release.py
          python3 -m unittest discover -s tests -v

      - name: Commit the published artifacts
        if: steps.enabled.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt/apk apk builds/apk index.json plugins.json builds/index.json builds/plugins.json builds/index.v2.json registry/extensions.json registry/extensions.v2.json
          git diff --cached --quiet && exit 0
          git commit -m 'mangadiyari: publish compiled APK and catalogs [skip ci]'
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload the tested release APK
        if: steps.enabled.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mangadiyari-published-apk
          path: keiyoushi-extensions-tr/src/tr/mangadiyari/build/outputs/apk/release/*.apk
