name: SadScans live capture (real browser)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/50f5727b-kitsugi-manga-plugins
      - arena/e222c71c-kitsugi-manga-plugins
      - main
    paths:
      - tools/capture_sadscans_live.mjs
      - .github/workflows/sadscans-capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --registry=https://registry.npmjs.org \
            playwright@1.56.1 2>&1 | tail -5
          npx --no-install playwright install chromium 2>&1 | tail -5
      - name: Capture the live site
        timeout-minutes: 12
        run: node tools/capture_sadscans_live.mjs || true
      - name: Save the evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/html-dumps/sadscans reports/sadscans-capture.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'yeni kanıt yok'
            exit 0
          fi
          git commit -m 'sadscans: canlı tarayıcı dökümü [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sadscans-live-capture
          path: |
            docs/html-dumps/sadscans
            reports/sadscans-capture.json
