name: Manga-TR tests and APK

on:
  workflow_dispatch:
  push:
    branches: [arena/f3fadc72-kitsugi-manga-plugins]
    paths:
      - keiyoushi-extensions-tr/src/tr/mangatr/**
      - mangatr/live/browser/**
      - tests/test_mangatr_snapshots.py
      - .github/workflows/mangatr-ci.yml

permissions:
  contents: write

concurrency:
  group: mangatr-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Apply the repository Kotlin formatter
        working-directory: keiyoushi-extensions-tr
        run: |
          set -o pipefail
          ./gradlew :src:tr:mangatr:spotlessApply 2>&1 | tee /tmp/mangatr-gradle.log
      - name: Save formatter-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add keiyoushi-extensions-tr/src/tr/mangatr
          git diff --cached --quiet && exit 0
          git commit -m 'style(mangatr): apply repository Kotlin formatter [skip ci]'
          git pull --rebase origin arena/f3fadc72-kitsugi-manga-plugins
          git push origin HEAD:arena/f3fadc72-kitsugi-manga-plugins
      - name: Run fixture tests and build release APK
        working-directory: keiyoushi-extensions-tr
        run: |
          set -o pipefail
          ./gradlew :src:tr:mangatr:testDebugUnitTest :src:tr:mangatr:assembleRelease 2>&1 | tee /tmp/mangatr-gradle.log
      - name: Expose build result in the check summary
        if: always()
        run: |
          tail -n 250 /tmp/mangatr-gradle.log >> "$GITHUB_STEP_SUMMARY" || true
          if [ "${{ job.status }}" = "failure" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          failures = []
          for report in Path('keiyoushi-extensions-tr/src/tr/mangatr/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      failures.append(case.get('name', 'test') + '\n' + failure.get('message', '') + '\n' + (failure.text or '')[:12000])
          lines = Path('/tmp/mangatr-gradle.log').read_text(errors='replace').splitlines()
          hits = [i for i, line in enumerate(lines) if line.startswith('e: ') or 'FAILURE: Build failed' in line or 'Execution failed for task' in line or 'What went wrong:' in line or 'MangaTRParserTest >' in line]
          selected = set()
          for i in hits:
              selected.update(range(max(0, i - 2), min(len(lines), i + 6)))
          text = '\n\n'.join(failures) if failures else ('\n'.join(lines[i] for i in sorted(selected))[-48000:] if hits else '\n'.join(lines)[-24000:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Gradle failure log::' + text)
          PY
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-test-results
          path: keiyoushi-extensions-tr/src/tr/mangatr/build/test-results/
          if-no-files-found: warn
      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mangatr-release-apk
          path: keiyoushi-extensions-tr/src/tr/mangatr/build/outputs/apk/release/*.apk
          if-no-files-found: error
