name: Verify single-source profile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/*.test.mjs

  native-api-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test actual native API client (no Android SDK needed)
        run: |
          bash kotatsu-parsers-tr/gradlew -p integration/kitsugi-api-tests test --no-daemon --console=plain
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('integration/kitsugi-api-tests/build/test-results/test').glob('TEST-*.xml'))
          assert reports, 'No executed JUnit test report'
          totals = {key: sum(int(ET.parse(path).getroot().get(key, '0')) for path in reports) for key in ['tests', 'failures', 'errors', 'skipped']}
          assert totals['tests'] >= 25 and not any(totals[key] for key in ['failures', 'errors', 'skipped']), totals
          print('::notice title=Native API JUnit results::' + str(totals))
          PY
