name: OkuToon raw fetch (diagnostic)

on:
  push:
    branches: [arena/777ee838-kitsugi-manga-plugins]
    paths:
      - tests/okutoon_runtime/probe.mjs
      - .github/workflows/okutoon-curl.yml

permissions:
  contents: write

jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: curl with a browser fingerprint
        run: |
          mkdir -p docs/html-dumps/okutoon
          {
            echo "=== curl http2 chrome headers ==="
            curl -sS --http2 -o /tmp/ch.html -w "status=%{http_code} bytes=%{size_download}\n" \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36' \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
              -H 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.8' \
              -H 'sec-ch-ua: "Chromium";v="124", "Google Chrome";v="124", "Not-A.Brand";v="99"' \
              -H 'sec-ch-ua-mobile: ?0' -H 'sec-ch-ua-platform: "Windows"' \
              -H 'Sec-Fetch-Dest: document' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Site: same-origin' \
              -H 'Upgrade-Insecure-Requests: 1' \
              https://okutoon.com/solo-leveling/bolum-200 || true
            grep -o 'readerPages\|reader-page\|Just a moment\|chapters/389' /tmp/ch.html 2>/dev/null | sort | uniq -c || true
            echo "--- head ---"
            head -c 1200 /tmp/ch.html 2>/dev/null || true
          } | tee docs/html-dumps/okutoon/curl.txt
      - name: Node probes
        run: |
          node tests/okutoon_runtime/probe.mjs 2>&1 | tee -a docs/html-dumps/okutoon/curl.txt || true
      - name: Commit
        if: always()
        run: |
          git config user.name kitsugi-tr-runtime
          git config user.email kitsugi-tr-runtime@users.noreply.github.com
          git add -A docs/html-dumps/okutoon
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(evidence): okutoon raw fetch probe [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
