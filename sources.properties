# Single-source recovery profile. All other source files are retained, not deleted.
activeSource=mangadenizi

# The vendored modern adapter is reference/build input, NOT the Kitsugi release artifact.
# The installable Kitsugi package is the native MEX under extensions/mangadenizi.
keiyoushi.enabled=tr:mangadenizi

# No Kotatsu parser is active. Enum identities and reading data are not deleted.
kotatsu.enabled=

# A ZIP containing plugin-only classes.dex + manifest.json, using the real host API.
kitsugi.adapter=mex
