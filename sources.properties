# Single-source recovery profile. Source files are retained, not deleted.
activeSource=golgebahcesi

# Only this APK is included in the Keiyoushi Gradle project.
keiyoushi.enabled=tr:golgebahcesi

# No legacy Kotatsu parser is active (including its obsolete MangaReader Golge parser).
# Names/enums are preserved so saved source identities are not renumbered or removed.
kotatsu.enabled=

# Kitsugi uses the native adapter from integration/kitsugi, not both adapters at once.
kitsugi.adapter=native
